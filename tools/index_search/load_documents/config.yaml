qdrant:
  host: "qdrant"
  port: 6333
  timeout: 120
  check_compatibility: false
  api_key: "QDRANT_API_KEY"

collection:
  name: "documents"

model:
  embedding: "BAAI/bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"  # fallback si RERANKER_MODEL non défini dans .env
  # Active ou désactive le chargement local des modèles.
  # Utile pour éviter de télécharger des modèles HuggingFace inutilement
  # lorsque l'API correspondante est utilisée.
  embedding_local: true
  reranker_local: true

embedding_api:
  enabled: false
  # Les variables suivantes peuvent aussi être définies dans le .env du serveur.
  # Le .env prend priorité sur config.yaml si les deux sont renseignés.
  # Variables d'environnement attendues : URL_EMBEDDING_API, EMBEDDING_MODEL, EMBEDDING_API_KEY
  base_url: "URL_EMBEDDING_API"
  api_key_env: "EMBEDDING_API_KEY"
  model: "EMBEDDING_MODEL"
  timeout: 30
  retry_attempts: 1
  retry_delay: 1.0

indexing:
  batch_size: 5
  documents_path: "documents"

# Génération ou extraction de résumés de documents (stockés sur le chunk 0 dans Qdrant)
summary:
  enabled: false              # true = générer via LLM ; false = extraire du fichier
  lang: "fr"                # langue demandée pour le résumé LLM
  # Les variables suivantes peuvent aussi être définies dans le .env du serveur.
  # Le .env prend priorité sur config.yaml si les deux sont renseignés.
  # Variables d'environnement attendues : URL_LLM_API, LLM_MODEL, LLM_API_KEY
  base_url: "URL_LLM_API"
  api_key_env: "LLM_API_KEY"
  model: "LLM_MODEL"
  llm:
    max_input_chars: 400000   # ~100 000 tokens (4 caractères/token)
    min_output_chars: 200
    max_output_chars: 400
    system_prompt: |
      Tu es un assistant expert en résumé de documents techniques et réglementaires.
      Produis un résumé factuel, neutre et très concis du document fourni.
      Le résumé doit :
      - Présenter l'objet principal du document en une phrase.
      - Optionnellement lister 1 à 2 points clés.
      - Ne rien inventer ni extrapoler au-delà du texte fourni.
      - Être rédigé en {lang}.
      - Avoir une longueur totale comprise entre 200 et 400 caractères MAXIMUM.
      - Mentionner la langue principale du document ou du standard si identifiable.
  fallback:
    max_chars: 400            # longueur max pour la description native ou le texte descriptif

reranker_api:
  enabled: true
  # Les variables suivantes peuvent aussi être définies dans le .env du serveur.
  # Le .env prend priorité sur config.yaml si les deux sont renseignés.
  # Variables d'environnement attendues : URL_RERANKER_API, RERANKER_MODEL, RERANKER_API_KEY
  base_url: "URL_EMBEDDING_API"
  api_key_env: "RERANKER_API_KEY"
  model: "RERANKER_MODEL"
  timeout: 30
  retry_attempts: 1
  retry_delay: 1.0
  max_consecutive_errors: 3
  max_batch_size: 100

search:
  limit: 3
  candidate_multiplier: 8
  min_candidates: 250
  scroll_limit_per_doc: 10000
  window_radius: 5
  full_document_chunk_threshold: 15
  rerank_pool_size: 60
  hybrid_dense_weight: 0.7

  aggregation_top_k: 3
  aggregation_max_weight: 0.9 # poids du score max
  aggregation_mean_weight: 0.1 # poids de la moyenne des top_k
  max_chunks_per_document: 3
